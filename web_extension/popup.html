<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script src="capture-store.js" defer></script><script src="popup.js" defer></script></head>
<body class="popup-page">
  <main>
    <h1>Article to Kindle</h1>
    <p id="title">Detecting article…</p>
    <p id="status" role="status" aria-live="polite"></p>
    <fieldset id="analysis-mode" aria-label="Article extraction method" disabled>
      <legend>Extraction method</legend>
      <label><input type="radio" name="analysis-mode" value="standard" checked> Standard</label>
      <label><input type="radio" name="analysis-mode" value="ai"> AI-assisted</label>
      <p class="help-text">AI labels the original article using your configured GPU. Long pages may take longer.</p>
    </fieldset>
    <button id="preview" disabled>Open article preview</button>
    <button id="options" class="link">Settings</button>
  </main>
</body>
</html>
