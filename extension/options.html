<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><script src="options.js" defer></script></head>
<body><main>
  <h1>Article to Kindle settings</h1>
  <label>Local server URL<input id="serverUrl" type="url" value="http://127.0.0.1:8765" required></label>
  <label>Bearer token<input id="token" type="password" required></label>
  <p>Set <code>ARTICLE_TO_KINDLE_ALLOWED_ORIGIN=<span id="origin"></span></code> in the server environment.</p>
  <button id="save">Save</button> <span id="status" role="status" aria-live="polite"></span>
</main></body>
</html>
